trigger:
  branches:
    include:
      - master

pr:
  branches:
    include:
      - master

pool:
  name: 'Azure Pipelines'

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET 10 SDK'
    inputs:
      packageType: 'sdk'
      version: '10.x'
      includePreviewVersions: false

  - task: DotNetCoreCLI@2
    displayName: 'Restore NuGet packages'
    inputs:
      command: 'restore'
      projects: '$(solution)'

  - task: DotNetCoreCLI@2
    displayName: 'Build solution'
    inputs:
      command: 'build'
      projects: '$(solution)'
      arguments: '--configuration $(buildConfiguration) --no-restore'

  - task: DotNetCoreCLI@2
    displayName: 'Run tests with code coverage'
    inputs:
      command: 'test'
      projects: 'SbDisplayTests/SbDisplayTests.csproj'
      arguments: >
        --configuration $(buildConfiguration)
        --no-build
        --collect:"XPlat Code Coverage"
        --results-directory $(Agent.TempDirectory)/TestResults
      publishTestResults: true

  - task: PublishCodeCoverageResults@2
    displayName: 'Publish code coverage'
    inputs:
      summaryFileLocation: '$(Agent.TempDirectory)/TestResults/**/coverage.cobertura.xml'

  - task: DotNetCoreCLI@2
    displayName: 'Publish API'
    inputs:
      command: 'publish'
      publishWebProjects: false
      projects: '$(apiProject)'
      arguments: '--configuration $(buildConfiguration) --output $(publishOutput) --no-build'
      zipAfterPublish: true

  - task: PublishPipelineArtifact@1
    displayName: 'Publish API artifact'
    inputs:
      targetPath: '$(publishOutput)'
      artifact: 'SbDisplayApi'
      publishLocation: 'pipeline'

  - task: PublishPipelineArtifact@1
    displayName: 'Publish Database Scripts artifact'
    inputs:
      targetPath: 'SbDisplay.Tests/DatabaseScripts'
      artifact: 'DatabaseScripts'
      publishLocation: 'pipeline'

  - task: PublishPipelineArtifact@1
    displayName: 'Publish Postman Collection artifact'
    inputs:
      targetPath: 'SbDisplay.Tests/Postman'
      artifact: 'Postman'
      publishLocation: 'pipeline'