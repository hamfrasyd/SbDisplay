name: Azure Static Web Apps CI/CD

pr:
  branches:
    include:
      - master
trigger:
  branches:
    include:
      - master

jobs:
- job: build_and_deploy_job
  displayName: Build and Deploy Job
  condition: or(eq(variables['Build.Reason'], 'Manual'),or(eq(variables['Build.Reason'], 'PullRequest'),eq(variables['Build.Reason'], 'IndividualCI')))
  pool:
    vmImage: ubuntu-latest
  variables:
  - group: Azure-Static-Web-Apps-mango-island-0f3576a10-variable-group
  steps:
  - checkout: self
    submodules: true

  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: Install Node.js

  - script: npm install
    workingDirectory: '$(Build.SourcesDirectory)/SbDisplayFront/shopbox-display'
    displayName: npm install

  - script: npm run build
    workingDirectory: '$(Build.SourcesDirectory)/SbDisplayFront/shopbox-display'
    displayName: npm run build

  - script: find $(Build.SourcesDirectory)/SbDisplayFront/shopbox-display/dist -type f | head -50
    displayName: Debug output structure

  - task: AzureStaticWebApp@0
    inputs:
      azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_ISLAND_0F3576A10)
      app_location: "/SbDisplayFront/shopbox-display"
      api_location: ""
      output_location: "dist/shopbox-display/browser"
      skip_app_build: true