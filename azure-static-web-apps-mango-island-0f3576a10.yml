name: Azure Static Web Apps CI/CD

pr:
  branches:
    include:
      - master

trigger:
  branches:
    include:
      - master

jobs:
- job: build_and_deploy_job
  displayName: Build and Deploy Angular App
  condition: or(eq(variables['Build.Reason'], 'Manual'), eq(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.Reason'], 'IndividualCI'))

  pool:
    vmImage: ubuntu-latest

  variables:
  - group: Azure-Static-Web-Apps-mango-island-0f3576a10-variable-group

  steps:
  - checkout: self
    submodules: true

  - task: NodeTool@0
    displayName: Install Node.js
    inputs:
      versionSpec: '20.x'

  - script: npm ci
    workingDirectory: '$(Build.SourcesDirectory)/SbDisplayFront/shopbox-display'
    displayName: Install dependencies

  - script: npm run build
    workingDirectory: '$(Build.SourcesDirectory)/SbDisplayFront/shopbox-display'
    displayName: Build Angular app

  - script: |
      echo "Checking Angular build output..."
      
      echo ""
      echo "Looking for index.html:"
      find $(Build.SourcesDirectory)/SbDisplayFront/shopbox-display/dist -name "index.html"

      echo ""
      echo "Listing build files:"
      find $(Build.SourcesDirectory)/SbDisplayFront/shopbox-display/dist -maxdepth 4 -type f | head -50
    displayName: Debug build output

  - task: AzureStaticWebApp@0
    displayName: Deploy Angular app to Azure Static Web Apps
    inputs:
      azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_ISLAND_0F3576A10)

      # Folder containing index.html
      app_location: "SbDisplayFront/shopbox-display/dist/shopbox-display"

      api_location: ""
      output_location: ""
      skip_app_build: true