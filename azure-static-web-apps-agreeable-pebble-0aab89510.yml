name: Azure Static Web Apps CI/CD

trigger:
  branches:
    include:
      - master

pr:
  branches:
    include:
      - master

pool:
  vmImage: ubuntu-latest

variables:
- group: Azure-Static-Web-Apps-agreeable-pebble-0aab89510-variable-group

steps:
- checkout: self
  submodules: true

- task: NodeTool@0
  inputs:
    versionSpec: '22.x'
  displayName: 'Install Node.js'

- script: |
    npm ci
    npm run build
  workingDirectory: 'SbDisplayFront/shopbox-display'
  displayName: 'Build Angular app'

- script: |
    ls SbDisplayFront/shopbox-display/dist/shopbox-display/browser
  displayName: 'Check build output'

- task: AzureStaticWebApp@0
  inputs:
    azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_PEBBLE_0AAB89510)
    app_location: "SbDisplayFront/shopbox-display/dist/shopbox-display/browser"
    api_location: ""
    output_location: ""
    skip_app_build: true