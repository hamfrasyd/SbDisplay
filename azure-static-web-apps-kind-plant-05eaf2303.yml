name: Azure Static Web Apps CI/CD

pr:
  branches:
    include:
      - master
trigger:
  branches:
    include:
      - master

jobs:
- job: build_and_deploy_job
  displayName: Build and Deploy Job
  condition: or(eq(variables['Build.Reason'], 'Manual'),or(eq(variables['Build.Reason'], 'PullRequest'),eq(variables['Build.Reason'], 'IndividualCI')))
  pool:
    vmImage: ubuntu-latest
  variables:
  - group: Azure-Static-Web-Apps-kind-plant-05eaf2303-variable-group
  - name: frontendApp
    value: SbDisplayFront/shopbox-display
  steps:
  - checkout: self
    submodules: true
  - task: NodeTool@0
    displayName: Install Node.js
    inputs:
      versionSpec: '22.x'
  - script: npm ci
    displayName: Install npm dependencies
    workingDirectory: $(Build.SourcesDirectory)/$(frontendApp)
  - script: npm run build
    displayName: Build Angular app
    workingDirectory: $(Build.SourcesDirectory)/$(frontendApp)
  - script: npm run test -- --no-watch
    displayName: Run unit tests
    workingDirectory: $(Build.SourcesDirectory)/$(frontendApp)
  - task: AzureStaticWebApp@0
    inputs:
      azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_PLANT_05EAF2303)
###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
# For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
      app_location: "/SbDisplayFront/shopbox-display" # App source code path
      api_location: "api" # Api source code path - optional
      output_location: "dist/shopbox-display/browser" # Built app content directory - optional
###### End of Repository/Build Configurations ######

